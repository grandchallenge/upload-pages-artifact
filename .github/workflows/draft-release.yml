name: Draft release
on:
  push:
    branches:
      - main

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: release-drafter/release-drafter@eada3c96a64734dd381cfbda23511034e328ddb0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
